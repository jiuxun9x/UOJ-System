name: Tests

on:
  push:
    branches:
      - master
      - 'school/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the dependencies of judge_client
        run: pip install requests

      - name: Judger unit tests
        run: make -C judger/uoj_judger test

      - name: judge_client unit tests
        run: python3 -m unittest discover -s judger/tests -v

      - name: Page script unit tests
        run: node web/tests/js/username_test.js

  e2e:
    name: End-to-end tests (${{ matrix.judgers }} judgers)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      matrix:
        include:
          - judgers: 1
            compose: -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml
          - judgers: 2
            compose: -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml -f tests/e2e/docker-compose.judger-2.yml
          - judgers: 4
            compose: -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml -f tests/e2e/docker-compose.judger-2.yml -f tests/e2e/docker-compose.judgers-3-4.yml
      fail-fast: false

    env:
      UOJ_E2E_JUDGERS: ${{ matrix.judgers }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            uoj-db.cache-from=type=gha,scope=uoj-db
            uoj-db.cache-to=type=gha,mode=max,scope=uoj-db
            uoj-web.cache-from=type=gha,scope=uoj-web
            uoj-web.cache-to=type=gha,mode=max,scope=uoj-web
            uoj-judger.cache-from=type=gha,scope=uoj-judger
            uoj-judger.cache-to=type=gha,mode=max,scope=uoj-judger

      - name: Web unit tests
        run: docker run --rm ghcr.io/universaloj/uoj-web:latest php /opt/uoj/web/tests/run.php

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the dependencies of the tests
        run: pip install requests

      - name: Start UOJ
        run: |
          bash prepare.sh
          python3 tests/e2e/configure.py
          docker compose ${{ matrix.compose }} up -d

      - name: End-to-end tests
        run: python3 -m unittest discover -s tests/e2e -v

      # a PHP error that stops a page, or a query that fails, is a failure even where no test
      # looked at that page
      - name: PHP errors and failed queries in the logs of the web server
        if: always()
        run: python3 tests/e2e/check_php_log.py

      # nothing of the web interface can be rendered where it is developed: these pictures are
      # how its pages are looked at
      - name: Screenshots of the pages
        if: always() && matrix.judgers == 1
        continue-on-error: true
        run: |
          # fonts-stix: a Mac has these fonts and MathJax prefers them to its own, so the browser
          # that looks at the pages has them too
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-stix > /dev/null
          pip install playwright > /dev/null
          python3 -m playwright install --with-deps chromium > /dev/null
          cd tests/e2e && python3 screenshots.py ../../screenshots

      - name: Upload screenshots
        if: always() && matrix.judgers == 1
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Collect logs
        if: always()
        run: |
          mkdir -p e2e-logs
          docker compose ${{ matrix.compose }} ps -a > e2e-logs/ps.txt 2>&1 || true
          for c in uoj-db uoj-web uoj-judger uoj-judger-2 uoj-judger-3 uoj-judger-4; do
            docker logs "$c" > "e2e-logs/$c.log" 2>&1 || true
          done
          docker exec uoj-web sh -c 'tail -n 2000 /var/log/apache2/uoj_error.log' > e2e-logs/apache_error.log 2>&1 || true
          # what a command started by a page writes to its standard error goes to the log of the
          # whole server, not to the one of the site
          docker exec uoj-web sh -c 'tail -n 2000 /var/log/apache2/error.log' > e2e-logs/apache_main_error.log 2>&1 || true
          docker exec uoj-web sh -c 'tail -n 2000 /var/log/apache2/uoj_judge.log' > e2e-logs/apache_judge.log 2>&1 || true
          sudo cp uoj_data/judger/log/judge.log e2e-logs/judge-1.log 2>/dev/null || true
          for n in 2 3 4; do
            sudo cp uoj_data/judger$n/log/judge.log e2e-logs/judge-$n.log 2>/dev/null || true
          done
          docker exec uoj-db mysql -uroot -proot app_uoj233 -e 'select * from judger_info; select id, problem_id, version, status, judger_name, attempts, reason, left(message, 300) from problem_data_versions order by id desc limit 40; select * from submission_judgements order by id desc limit 60; select id, problem_id, status, judger_name, judge_attempts, score, result_error from submissions order by id desc limit 60; select * from user_roles; select * from contests_permissions; select * from external_identities; select * from user_renames; select id, actor, actor_type, action, resource_type, resource_id, left(after_json, 200), created_at from audit_logs order by id desc limit 80' > e2e-logs/db.txt 2>&1 || true
          sudo chmod -R a+r e2e-logs
          tail -n 60 e2e-logs/judge-1.log e2e-logs/apache_error.log 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.judgers }}
          path: e2e-logs

  # How fast submissions are judged, on a site that nothing else uses: one at a time with one
  # judger, then many at once with one and with four. It measures and reports (in the summary of
  # the run and the artifact judging-speed); it does not judge the numbers.
  speed:
    name: Judging speed
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      UOJ_E2E_JUDGERS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            uoj-db.cache-from=type=gha,scope=uoj-db
            uoj-web.cache-from=type=gha,scope=uoj-web
            uoj-judger.cache-from=type=gha,scope=uoj-judger

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the dependencies of the tests
        run: pip install requests

      - name: Start UOJ with one judger
        run: |
          bash prepare.sh
          python3 tests/e2e/configure.py
          docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d

      - name: One submission at a time
        run: python3 tests/e2e/judging_speed.py latency judging-speed/latency.json

      - name: Many submissions at once, one judger
        run: python3 tests/e2e/judging_speed.py burst judging-speed/burst-1.json

      # as on a machine of their own: written by judger/workers.sh, one judger on each CPU, all with
      # one judging account, reaching the site by its address
      - name: Many submissions at once, four judgers on a CPU each with one account
        env:
          UOJ_SPEED_JUDGERS: speed-cpu0,speed-cpu1,speed-cpu2,speed-cpu3
        run: |
          docker stop uoj-judger
          bash judger/workers.sh --url http://host.docker.internal --name compose_judger_2 --password _judger_password_2_ \
            --cpus 0-3 --allow-smt --image ghcr.io/universaloj/uoj-judger:latest --prefix speed \
            --add-host host.docker.internal:host-gateway --output speed-workers.yml
          docker compose -p speedworkers -f speed-workers.yml up -d
          python3 tests/e2e/judging_speed.py burst judging-speed/burst-4.json

      # whether judgers that share a machine measure the times of programs as one alone does
      - name: Times of programs judged alone and four at once
        env:
          UOJ_SPEED_JUDGERS: speed-cpu0,speed-cpu1,speed-cpu2,speed-cpu3
        run: python3 tests/e2e/judging_speed.py timing judging-speed/timing-4.json

      # the four CPUs of the runners are two cores with two hyperthreads each: the same, with one
      # judger on each core, as workers.sh does by default
      - name: Times of programs judged alone and two at once, on two cores
        run: |
          docker compose -p speedworkers -f speed-workers.yml down -t 5
          CPUS=$(for f in /sys/devices/system/cpu/cpu[0-9]*/topology/thread_siblings_list; do cut -d, -f1 "$f" | cut -d- -f1; done | sort -un | head -n 2 | paste -sd, -)
          echo "one judger on each of the CPUs $CPUS"
          bash judger/workers.sh --url http://host.docker.internal --name compose_judger_2 --password _judger_password_2_ \
            --cpus "$CPUS" --image ghcr.io/universaloj/uoj-judger:latest --prefix speed2 \
            --add-host host.docker.internal:host-gateway --output speed-workers-2.yml
          docker compose -p speedworkers2 -f speed-workers-2.yml up -d
          UOJ_SPEED_JUDGERS=$(echo "$CPUS" | sed -E 's/[0-9]+/speed2-cpu&/g') python3 tests/e2e/judging_speed.py timing judging-speed/timing-2.json

      - name: Collect logs
        if: always()
        run: |
          mkdir -p judging-speed
          for c in uoj-web uoj-judger speed-cpu0 speed-cpu1 speed-cpu2 speed-cpu3; do
            docker logs "$c" > "judging-speed/$c.log" 2>&1 || true
          done
          sudo cp uoj_data/judger/log/judge.log judging-speed/judge-1.log 2>/dev/null || true
          for n in 0 1 2 3; do
            sudo cp judger-workers/cpu$n/judge.log judging-speed/judge-cpu$n.log 2>/dev/null || true
          done
          sudo chmod -R a+r judging-speed

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judging-speed
          path: judging-speed

  # A site set up on MySQL 5.7 is upgraded to MySQL 8.4 with upgrade-mysql.sh, as its
  # administrators would do it, and keeps all it had.
  upgrade:
    name: Upgrade from MySQL 5.7
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      UOJ_E2E_JUDGERS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            uoj-db.cache-from=type=gha,scope=uoj-db
            uoj-web.cache-from=type=gha,scope=uoj-web
            uoj-judger.cache-from=type=gha,scope=uoj-judger

      - name: Build the database image of MySQL 5.7
        run: docker build -t uoj-db-mysql57 -f tests/e2e/upgrade/mysql57/Dockerfile .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the dependencies of the tests
        run: pip install requests

      - name: Start UOJ on MySQL 5.7
        run: |
          bash prepare.sh
          python3 tests/e2e/configure.py
          docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml -f tests/e2e/upgrade/docker-compose.mysql57.yml up -d

      - name: Data written on MySQL 5.7
        run: python3 tests/e2e/upgrade_check.py seed

      - name: The upgrade
        env:
          UOJ_COMPOSE: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml
          UOJ_SKIP_BUILD: 1
        run: bash upgrade-mysql.sh

      - name: The data on MySQL 8.4
        run: python3 tests/e2e/upgrade_check.py verify

      - name: PHP errors and failed queries in the logs of the web server
        if: always()
        run: python3 tests/e2e/check_php_log.py

      - name: Collect logs
        if: always()
        run: |
          mkdir -p upgrade-logs
          for c in uoj-db uoj-web uoj-judger uoj-db-upgrade; do
            docker logs "$c" > "upgrade-logs/$c.log" 2>&1 || true
          done
          docker exec uoj-web sh -c 'tail -n 2000 /var/log/apache2/uoj_error.log' > upgrade-logs/apache_error.log 2>&1 || true
          sudo cp uoj_data/judger/log/judge.log upgrade-logs/judge.log 2>/dev/null || true
          cp upgrade_state.json upgrade-logs/ 2>/dev/null || true
          sudo chmod -R a+r upgrade-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs
          path: upgrade-logs
