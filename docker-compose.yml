services:
  uoj-db:
    image: ghcr.io/universaloj/uoj-db:latest
    build:
      context: ./db/
      dockerfile: Dockerfile
    container_name: uoj-db
    restart: always
    volumes:
      - ./uoj_data/db/mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=app_uoj233
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  uoj-web:
    image: ghcr.io/universaloj/uoj-web:latest
    build:
      context: ./
      dockerfile: web/Dockerfile
    container_name: uoj-web
    restart: always
    stdin_open: true
    tty: true
    depends_on:
      uoj-db:
        condition: service_healthy
    volumes:
      - ./uoj_data/web/data:/var/uoj_data
      - ./uoj_data/web/storage:/opt/uoj/web/app/storage
      # the backups the site makes of itself every day; put this on another disk if you can
      - ./uoj_data/backup:/var/uoj_backup
      - type: bind
        source: ./.config.local.php
        target: /opt/uoj/web/app/.config.php
    ports:
      - "80:80"
      - "3690:3690"
    environment:
      - DATABASE_HOST=uoj-db
      - DATABASE_PASSWORD=root
      - JUDGER_SOCKET_PORT=2333
      - JUDGER_SOCKET_PASSWORD=_judger_socket_password_
      - SALT_0=_salt_0_
      - SALT_1=_salt_1_
      - SALT_2=_salt_2_
      - SALT_3=_salt_3_
      - UOJ_PROTOCOL=http

  uoj-judger:
    image: ghcr.io/universaloj/uoj-judger:latest
    build:
      context: ./judger/
      dockerfile: Dockerfile
    container_name: uoj-judger
    restart: always
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    # A judger measures time and memory. It tolerates a busy machine, but its results are most
    # stable with CPUs of its own, and it must not swap. Adapt these to the machine:
    # cpuset: "2,3"
    # mem_limit: 8g
    # memswap_limit: 8g  # the same as mem_limit: no swap
    depends_on:
      - uoj-web
    volumes:
      - ./uoj_data/judger/log:/opt/uoj_judger/log
    environment:
      - UOJ_PROTOCOL=http
      - UOJ_HOST=uoj-web
      - JUDGER_NAME=compose_judger
      - JUDGER_PASSWORD=_judger_password_
      - SOCKET_PORT=2333
      - SOCKET_PASSWORD=_judger_socket_password_
