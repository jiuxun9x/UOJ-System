# Additions to docker-compose.yml for the end-to-end tests: the accounts of the judgers that the
# tests may start, and of a judger for the tests that talk to the judge API themselves.
#
#   docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml \
#       -f tests/e2e/docker-compose.judger-2.yml up -d

services:
  uoj-db:
    volumes:
      - ./tests/e2e/add_judgers.sql:/docker-entrypoint-initdb.d/003-add_judgers.sql:ro

  # the school of the tests of the single sign-on runs in the test process, on the host
  uoj-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
